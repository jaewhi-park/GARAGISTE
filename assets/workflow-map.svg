<text x="600" y="234" text-anchor="middle" class="role">/run — build · review · ship in one go; it stops only for an escalation, a fix loop past 3 rounds, merge approval</text>
<text x="78" y="92" class="title">start · once</text>
<text x="316" y="142" class="title">hotfix · one pass, no plan — up to 3 files / 50 logic lines; a Risk path stops it</text>
<text x="600" y="192" text-anchor="middle" class="role">after the merge, the next backlog item → /plan</text>
<text x="62" y="332" class="title">main line · every piece of work</text>
<text x="350" y="390" class="title">parallel — plans whose files do not overlap</text>
<text x="330" y="480" class="title">after the merge · release and retro</text>

