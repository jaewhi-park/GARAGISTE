<circle cx="750" cy="120" r="4.5" class="st st-express"/><text x="750" y="100" text-anchor="middle" class="role">reviewer, one lens</text>
<circle cx="900" cy="120" r="9" class="ceo"/><text x="900" y="82" text-anchor="middle" class="role">read the diff · never auto-merged</text><text x="900" y="100" text-anchor="middle" class="name">merge the PR</text>

