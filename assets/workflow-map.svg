<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="GARAGISTE workflow map. The start line (/brainstorm, /kickoff or /assess, /hire) joins the main line (/backlog, /plan, /build, /review, /ship, merge); the /hotfix line runs above it from /plan to a separate PR-merge stop with three team stops and no plan; the parallel branch leaves /plan through /parallel or /spawn and /integrate and rejoins at /ship; the after-merge loop goes through /release and /retro back to /plan. Double rings are the stops where the CEO answers or approves.">
